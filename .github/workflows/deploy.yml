# CLOUDFLARE_API_TOKEN is the BOARDS token (one-token-per-project).
# Do not reuse the PWA/skyrail landing token.
# Durable host is boards.skyrailreclamation.com. workers.dev is not the product.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "public/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy skyrail-boards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '95aea3d30c8926aafa5296b257fe6386' }}
        run: node deploy.mjs
