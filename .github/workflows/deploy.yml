# CLOUDFLARE_API_TOKEN is the BOARDS token (one-token-per-project).
# Do not reuse the PWA/skyrail landing token.
# Durable host is boards.skyrailreclamation.com. workers.dev is not the product.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "public/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A red tree must never reach the durable host. ci.yml runs the same suite
      # on every push, but that is a REPORT — this is the GATE, because it sits
      # between the checkout and the upload. Until 2026-08-26 deploy.yml shipped
      # bytes without ever running a test.
      - name: The suite must be green before any byte ships
        run: node --test "test/*.test.js"

      - name: Deploy skyrail-boards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '95aea3d30c8926aafa5296b257fe6386' }}
        run: node deploy.mjs
